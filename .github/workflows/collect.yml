# Scheduled collection. Needs one repository secret, DATABASE_URL (a hosted Postgres such as Neon);
# without it every run stops at the first step, so the schedule is harmless until the secret exists.
# Each run collects for about 45 minutes (blocklists, OpenPhish, new registrations, the certificate
# log sample, registry lookups, SmishTank), then recomputes the report and keeps it as a run artifact.
name: collect

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours, off the hour
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check the database secret
        id: check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret is not set; nothing to do."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - if: steps.check.outputs.ok == 'true'
        run: pip install -e .
      - if: steps.check.outputs.ok == 'true'
        run: python -m scamwatch migrate
      - name: Collect
        if: steps.check.outputs.ok == 'true'
        run: python -m scamwatch watch --hours 0.75
      - name: Report
        if: steps.check.outputs.ok == 'true'
        run: python -m scamwatch report
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ok == 'true'
        with:
          name: report-${{ github.run_id }}
          path: outputs/
          retention-days: 30
