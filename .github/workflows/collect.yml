# Scheduled collection. Needs one repository secret, DATABASE_URL (a hosted Postgres such as Neon);
# without it every run stops at the first step, so the schedule is harmless until the secret exists.
# Each run collects for about 45 minutes (blocklists, OpenPhish, new registrations, the certificate
# log sample, registry lookups, SmishTank), recomputes the report, rebuilds dashboard/index.html and
# commits both; Vercel redeploys the dashboard from that commit.
name: collect

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours, off the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check the database secret
        id: check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret is not set; nothing to do."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - if: steps.check.outputs.ok == 'true'
        run: pip install -e .
      - name: Seed an empty database (first run only)
        if: steps.check.outputs.ok == 'true'
        run: |
          has=$(psql "$DATABASE_URL" -Atc "SELECT to_regclass('public.schema_migrations') IS NOT NULL")
          if [ "$has" = "t" ]; then echo "database already has data"; exit 0; fi
          seed=$(ls data/seed/*.sql.gz | sort | tail -1)
          echo "loading $seed"
          gunzip -c "$seed" | psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q
      - if: steps.check.outputs.ok == 'true'
        run: python -m scamwatch migrate
      - name: Collect
        if: steps.check.outputs.ok == 'true'
        run: python -m scamwatch watch --hours 0.75
      - name: Report
        if: steps.check.outputs.ok == 'true'
        run: python -m scamwatch report
      - name: Dashboard
        if: steps.check.outputs.ok == 'true'
        run: python -m scamwatch dashboard
      - name: Commit the refreshed numbers
        if: steps.check.outputs.ok == 'true'
        run: |
          git config user.name "scamwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs dashboard/index.html
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Refresh results and dashboard [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
